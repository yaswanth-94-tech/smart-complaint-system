# Render Blueprint for SCMS (Deploys Frontend & Backend at once)
services:
  # 1. Express Backend Web Service
  - type: web
    name: scms-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: scms-frontend
          property: url

  # 2. React Frontend Static Site
  - type: web
    name: scms-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: scms-backend
          property: url
          postfix: /api
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: scms-hackathon.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: scms-hackathon
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: scms-hackathon.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID: "67897379992"
      - key: VITE_FIREBASE_APP_ID: "1:67897379992:web:d596aedcfc7af1f03514ed"
